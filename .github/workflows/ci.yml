name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-harness:
    name: Harness tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest pytest-timeout
      - name: Collect tests (sanity check)
        run: pytest tests/harness/ tests/computer-use/ --collect-only -q
        timeout-minutes: 1
      - name: Run harness tests (per-file)
        run: |
          failed=0
          for f in tests/harness/test_*.py; do
            echo "::group::$f"
            timeout 30 pytest "$f" -v --timeout=10 --tb=short 2>&1 || {
              echo "FAILED or TIMED OUT: $f"
              failed=1
            }
            echo "::endgroup::"
          done
          exit $failed
        timeout-minutes: 4
      - name: Run computer-use tests (per-file)
        run: |
          failed=0
          for f in tests/computer-use/test_*.py; do
            echo "::group::$f"
            timeout 30 pytest "$f" -v --timeout=10 --tb=short 2>&1 || {
              echo "FAILED or TIMED OUT: $f"
              failed=1
            }
            echo "::endgroup::"
          done
          exit $failed
        timeout-minutes: 4

  test-notifications:
    name: Notifications tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest -r notifications/requirements.txt
      - name: Run notifications tests
        run: pytest tests/notifications/ -v

  test-notifications-js:
    name: Notifications tests (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run notifications JS tests
        run: node --test tests/notifications/test_socket_listener.mjs tests/notifications/test_next_task.mjs

  lint-python:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax
        run: find harness computer-use -name "*.py" -not -name "test_*" -not -path "*/__pycache__/*" | xargs python -m py_compile

  test-secrets:
    name: Secrets vault tests (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run vault tests
        run: node --test tests/secrets/test_vault.mjs

  test-email:
    name: Email tests (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install email dependencies
        run: npm install --prefix email
      - name: Run email tests
        run: node --test tests/email/test_email_poller.mjs tests/email/test_gmail_client.mjs

  test-slack:
    name: Slack tests (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install slack dependencies
        run: npm install --prefix slack
      - name: Run slack tests
        run: node --test tests/slack/test_slack_helpers.mjs tests/slack/test_slack_client.mjs

  test-setup:
    name: Setup tests (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run setup tests
        run: node --test tests/setup/test_setup_helpers.mjs tests/setup/test_setup_utils.mjs

  lint-js:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax (all .mjs files)
        run: find secrets slack notifications email -name "*.mjs" -not -path "*/node_modules/*" | xargs -I{} node --check {}

  build-hub:
    name: Hub build (Svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install hub dependencies
        run: npm install --prefix hub
      - name: Build hub
        run: npm run build --prefix hub

  test-hub:
    name: Hub tests (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install hub dependencies
        run: npm install --prefix hub
      - name: Run hub tests
        run: node --import=./tests/hub/helpers/kit-loader.mjs --test tests/hub/*.test.js

  check-line-limits:
    name: File line limit (200)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files under 200 lines
        # Single source of truth: the same script the hub build runs as a prebuild.
        # The old inline glob only saw a few hardcoded extensions/paths (missed e.g.
        # harness/scripts/*.sh), so a >200-line file could pass this gate yet fail the
        # hub build — exactly what happened to full-update.sh @214 (#768).
        run: bash scripts/check-file-length.sh
